name: Update dependencies

on:
  schedule:
    - cron: "23 5 * * 1" # every Monday at 5:23 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update_dependencies.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-dependencies
          delete-branch: true
          commit-message: Update dependencies
          title: Update dependencies
          body: |
            Automated run of `scripts/update_dependencies.py`.
            Review major bumps and re-run CI before merging.
