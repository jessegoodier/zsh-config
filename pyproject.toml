[project]
name = "zsh-config"
version = "0.1.0"
description = "python tools for my profile"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.115",
    "botocore[crt]",
    "fastmcp",
    "pygithub",
    "pyyaml",
    "requests",
    "rich",
    "urllib3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
