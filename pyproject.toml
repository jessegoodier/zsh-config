[project]
name = "zsh-config"
version = "0.1.0"
description = "python tools for my profile"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.122",
    "botocore[crt]>=1.43.122",
    "fastmcp>=4.1.4",
    "pygithub>=2.10.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
